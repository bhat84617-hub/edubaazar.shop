<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - EduBazar.shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <style>
        :root{--primary:#4F46E5;--primary-dark:#4338CA;--secondary:#F59E0B;--dark:#1E1B4B;--gray:#6B7280;--gray-light:#F3F4F6;--white:#FFFFFF;--green:#10B981;--red:#EF4444;--gradient:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);--shadow:0 10px 40px rgba(79,70,229,0.15);--transition:all 0.3s ease}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:var(--gray-light);color:var(--dark);min-height:100vh}

        /* Sidebar */
        .sidebar{position:fixed;left:0;top:0;width:260px;height:100%;background:var(--dark);z-index:100;padding:30px 20px;transition:var(--transition)}
        .sidebar-logo{display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;font-size:1.3rem;font-weight:700;margin-bottom:40px}
        .sidebar-logo i{font-size:1.8rem;color:var(--secondary)}
        .sidebar-menu{list-style:none}
        .sidebar-menu li{margin-bottom:8px}
        .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:12px 16px;color:rgba(255,255,255,0.7);text-decoration:none;border-radius:10px;transition:var(--transition);font-weight:500}
        .sidebar-menu a:hover,.sidebar-menu a.active{background:rgba(255,255,255,0.1);color:var(--white)}
        .sidebar-menu a.active{background:var(--gradient)}
        .sidebar-menu a i{width:20px;text-align:center}

        /* Main */
        .main{margin-left:260px;padding:30px}

        /* Top Bar */
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;background:var(--white);padding:20px 30px;border-radius:16px;box-shadow:var(--shadow)}
        .topbar h1{font-size:1.5rem;font-weight:700}
        .topbar-right{display:flex;align-items:center;gap:15px}
        .user-email{color:var(--gray);font-size:0.85rem;font-weight:500}
        .btn-back{padding:10px 20px;background:var(--gray-light);border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;color:var(--dark);font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:8px}
        .btn-back:hover{background:var(--primary);color:var(--white)}
        .user-avatar{width:45px;height:45px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:var(--white);font-weight:700;font-size:1.1rem}

        /* Stats Cards */
        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
        .stat-card{background:var(--white);border-radius:16px;padding:25px;box-shadow:var(--shadow);transition:var(--transition)}
        .stat-card:hover{transform:translateY(-5px)}
        .stat-card-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;font-size:1.3rem}
        .stat-card-icon.blue{background:rgba(79,70,229,0.1);color:var(--primary)}
        .stat-card-icon.green{background:rgba(16,185,129,0.1);color:var(--green)}
        .stat-card-icon.orange{background:rgba(245,158,11,0.1);color:var(--secondary)}
        .stat-card-icon.red{background:rgba(239,68,68,0.1);color:var(--red)}
        .stat-card h3{font-size:2rem;font-weight:800;color:var(--dark)}
        .stat-card p{color:var(--gray);font-size:0.85rem}

        /* Orders Table */
        .orders-section{background:var(--white);border-radius:16px;padding:30px;box-shadow:var(--shadow)}
        .orders-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
        .orders-header h2{font-size:1.3rem;font-weight:700}
        .orders-search{padding:10px 20px;border:2px solid var(--gray-light);border-radius:10px;font-family:'Poppins',sans-serif;width:250px;transition:var(--transition)}
        .orders-search:focus{border-color:var(--primary);outline:none}
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:15px 12px;border-bottom:2px solid var(--gray-light);color:var(--gray);font-size:0.85rem;font-weight:600}
        td{padding:15px 12px;border-bottom:1px solid var(--gray-light);font-size:0.9rem}
        tr:hover{background:rgba(79,70,229,0.02)}
        .status-badge{padding:5px 12px;border-radius:50px;font-size:0.75rem;font-weight:600}
        .status-completed{background:rgba(16,185,129,0.1);color:var(--green)}
        .status-pending{background:rgba(245,158,11,0.1);color:var(--secondary)}
        .btn-download{padding:8px 18px;background:var(--gradient);color:var(--white);border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Poppins',sans-serif;font-size:0.8rem;display:inline-flex;align-items:center;gap:6px}
        .btn-download:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(79,70,229,0.3)}
        .btn-download:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .no-orders{text-align:center;padding:60px 20px;color:var(--gray)}
        .no-orders i{font-size:4rem;color:var(--gray-light);margin-bottom:15px}
        .no-orders p{font-size:1.1rem;margin-bottom:20px}
        .btn-shop{padding:12px 30px;background:var(--gradient);color:var(--white);border:none;border-radius:50px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Poppins',sans-serif;display:inline-flex;align-items:center;gap:8px;transition:var(--transition)}
        .btn-shop:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(79,70,229,0.3)}
        .empty-orders{text-align:center;padding:80px 20px}
        .empty-orders i{font-size:5rem;color:var(--gray-light);margin-bottom:20px}
        .empty-orders h3{font-size:1.3rem;margin-bottom:10px}

        /* Responsive */
        @media(max-width:1024px){.stats-row{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:768px){.sidebar{width:70px;padding:20px 10px}.sidebar-logo span,.sidebar-menu a span{display:none}.sidebar-menu a{justify-content:center;padding:12px}.main{margin-left:70px}.stats-row{grid-template-columns:1fr}table{font-size:0.8rem}th,td{padding:10px 6px}}
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="index.html" class="sidebar-logo"><img src="edulogo1.png" alt="EduBazar Logo" style="height:32px;width:auto;border-radius:8px;"><span>EduBazar</span></a>
        <ul class="sidebar-menu">
            <li><a href="user-dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <li><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Browse Courses</span></a></li>
            <li><a href="#"><i class="fas fa-cog"></i><span>Settings</span></a></li>
            <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <h1>My Dashboard</h1>
            <div class="topbar-right">
                <span class="user-email" id="userEmail"></span>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Store</a>
                <div class="user-avatar" id="userAvatar">U</div>
            </div>
        </div>

        <div class="stats-row" data-aos="fade-up">
            <div class="stat-card">
                <div class="stat-card-icon blue"><i class="fas fa-shopping-bag"></i></div>
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon green"><i class="fas fa-download"></i></div>
                <h3 id="totalDownloads">0</h3>
                <p>Total Downloads</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon orange"><i class="fas fa-rupee-sign"></i></div>
                <h3 id="totalSpent">₹0</h3>
                <p>Total Spent</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon red"><i class="fas fa-book-open"></i></div>
                <h3 id="totalCourses">0</h3>
                <p>Courses Owned</p>
            </div>
        </div>

        <div class="orders-section" data-aos="fade-up">
            <div class="orders-header">
                <h2><i class="fas fa-box-open"></i> My Orders</h2>
                <input type="text" class="orders-search" placeholder="Search orders..." id="orderSearch">
            </div>
            <div id="ordersContainer"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const auth = JSON.parse(sessionStorage.getItem('edubazar_user_auth'));
        if (!auth) { window.location.href = 'user-login.html'; }

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.removeItem('edubazar_user_auth');
            window.location.href = 'index.html';
        });

        AOS.init({duration: 800, once: true});

        if (auth) {
            document.getElementById('userEmail').textContent = auth.name || auth.email;
            document.getElementById('userAvatar').textContent = (auth.name || auth.email).charAt(0).toUpperCase();
        }

        async function loadUserOrders() {
            let orders = [];

            // Try Supabase first
            if (typeof _sb !== 'undefined' && auth) {
                try {
                    const { data } = await _sb.from('orders').select('*').eq('email', auth.email).order('date', { ascending: false });
                    if (data && data.length > 0) {
                        orders = data.map(o => ({
                            orderId: o.order_id,
                            name: o.name,
                            email: o.email,
                            items: typeof o.items === 'string' ? JSON.parse(o.items) : o.items,
                            total: o.total,
                            status: o.status,
                            paymentMethod: o.payment_method,
                            date: o.date,
                            downloadLinks: []
                        }));
                    }
                } catch (e) {}
            }

            // Fallback to localStorage
            if (orders.length === 0) {
                orders = (JSON.parse(localStorage.getItem('edubazar_orders')) || []).filter(o => o.email && o.email.toLowerCase() === auth.email.toLowerCase());
            }

            return orders;
        }

        loadUserOrders().then(orders => {
            document.getElementById('totalOrders').textContent = orders.length;
            const allItems = orders.flatMap(o => o.items || []);
            document.getElementById('totalCourses').textContent = allItems.length;
            document.getElementById('totalSpent').textContent = '₹' + orders.reduce((sum, o) => sum + (o.total || 0), 0);

            const container = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders">
                        <i class="fas fa-shopping-basket"></i>
                        <h3>No Orders Yet</h3>
                        <p>You haven't placed any orders. Start shopping to see your orders here!</p>
                        <a href="index.html" class="btn-shop"><i class="fas fa-shopping-bag"></i> Browse Courses</a>
                    </div>`;
            } else {
                let html = `<table><thead><tr><th>Order ID</th><th>Items</th><th>Total</th><th>Payment</th><th>Date</th><th>Status</th></tr></thead><tbody>`;
                orders.forEach(order => {
                    const date = new Date(order.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                    html += `<tr>
                        <td><strong>${order.orderId}</strong></td>
                        <td>${(order.items||[]).map(i => i.name).join(', ')}</td>
                        <td><strong>₹${order.total}</strong></td>
                        <td>Razorpay</td>
                        <td>${date}</td>
                        <td><span class="status-badge status-completed">Completed</span></td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            }
        });

        document.getElementById('orderSearch').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(val) ? '' : 'none';
            });
        });
    </script>
    <style>@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}</style>
</body>
</html>
