<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EduBazar.shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--primary:#4F46E5;--secondary:#F59E0B;--dark:#1E1B4B;--gray:#6B7280;--gray-light:#F3F4F6;--white:#FFFFFF;--green:#10B981;--red:#EF4444;--gradient:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);--shadow:0 20px 60px rgba(79,70,229,0.2)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Montserrat',sans-serif;background:linear-gradient(135deg,#1E1B4B 0%,#312E81 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-card{background:var(--white);border-radius:24px;padding:50px 40px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:center;animation:slideUp 0.6s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .login-icon{width:80px;height:80px;margin:0 auto 20px;background:var(--gradient);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--white);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,0.4)}50%{box-shadow:0 0 0 15px rgba(79,70,229,0)}}
        .login-card h1{font-size:1.5rem;font-weight:800;margin-bottom:8px;color:var(--dark)}
        .login-card p{color:var(--gray);font-size:0.9rem;margin-bottom:30px}
        .form-group{margin-bottom:18px;text-align:left}
        .form-group label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;color:var(--dark)}
        .form-group input{width:100%;padding:14px 18px;border:2px solid var(--gray-light);border-radius:12px;font-size:1rem;font-family:'Montserrat',sans-serif;transition:0.3s;outline:none}
        .form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
        .btn-login{width:100%;padding:16px;background:var(--gradient);color:var(--white);border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:0.3s;font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(79,70,229,0.3)}
        .error-msg{display:none;color:var(--red);font-size:0.85rem;margin-top:10px;animation:shake 0.5s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        .back-link{display:inline-block;margin-top:20px;color:var(--gray);text-decoration:none;font-size:0.85rem;transition:0.3s}
        .back-link:hover{color:var(--primary)}
        .hint{font-size:0.75rem;color:var(--gray);margin-top:15px;padding:10px;background:var(--gray-light);border-radius:8px}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-shield-alt"></i></div>
        <h1>Admin Access</h1>
        <p>Enter admin credentials to access the dashboard</p>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-lock"></i> Access Dashboard</button>
        </form>
        <div class="error-msg" id="errorMsg">Invalid password! Access denied.</div>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
        <div class="hint"><i class="fas fa-info-circle"></i> Hint: Admin password is <strong>admin123</strong></div>
    </div>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            if (password === 'admin123') {
                sessionStorage.setItem('adminAuth', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.style.animation = 'none';
                setTimeout(() => errorMsg.style.animation = 'shake 0.5s ease', 10);
                document.getElementById('adminPassword').value = '';
            }
        });
        if (sessionStorage.getItem('adminAuth') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
