<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EduBazar.shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <style>
        :root{--primary:#4F46E5;--primary-dark:#4338CA;--secondary:#F59E0B;--dark:#1E1B4B;--gray:#6B7280;--gray-light:#F3F4F6;--white:#FFFFFF;--green:#10B981;--red:#EF4444;--gradient:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);--shadow:0 10px 40px rgba(79,70,229,0.15);--transition:all 0.3s ease}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:var(--gray-light);color:var(--dark);min-height:100vh}

        /* Sidebar */
        .sidebar{position:fixed;left:0;top:0;width:260px;height:100%;background:linear-gradient(180deg,#1E1B4B 0%,#312E81 100%);z-index:100;padding:30px 20px}
        .sidebar-logo{display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;font-size:1.3rem;font-weight:700;margin-bottom:10px}
        .sidebar-logo i{font-size:1.8rem;color:var(--secondary)}
        .admin-badge{display:inline-block;padding:3px 10px;background:var(--secondary);color:var(--dark);border-radius:50px;font-size:0.65rem;font-weight:700;margin-bottom:30px}
        .sidebar-menu{list-style:none}
        .sidebar-menu li{margin-bottom:8px}
        .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:12px 16px;color:rgba(255,255,255,0.7);text-decoration:none;border-radius:10px;transition:var(--transition);font-weight:500}
        .sidebar-menu a:hover,.sidebar-menu a.active{background:rgba(255,255,255,0.1);color:var(--white)}
        .sidebar-menu a.active{background:var(--gradient)}
        .sidebar-menu a i{width:20px;text-align:center}

        /* Main */
        .main{margin-left:260px;padding:30px}

        /* Top Bar */
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;background:var(--white);padding:20px 30px;border-radius:16px;box-shadow:var(--shadow)}
        .topbar h1{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:10px}
        .topbar h1 i{color:var(--secondary)}
        .topbar-right{display:flex;align-items:center;gap:15px}
        .btn-back{padding:10px 20px;background:var(--gray-light);border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;color:var(--dark);font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:8px}
        .btn-back:hover{background:var(--primary);color:var(--white)}
        .btn-export{padding:10px 20px;background:var(--green);border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:var(--transition);color:var(--white);font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:8px}
        .btn-export:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(16,185,129,0.3)}
        .admin-avatar{width:45px;height:45px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;color:var(--dark);font-weight:700;font-size:1.1rem}

        /* Stats Cards */
        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
        .stat-card{background:var(--white);border-radius:16px;padding:25px;box-shadow:var(--shadow);transition:var(--transition);position:relative;overflow:hidden}
        .stat-card:hover{transform:translateY(-5px)}
        .stat-card::after{content:'';position:absolute;top:0;right:0;width:100px;height:100px;border-radius:50%;opacity:0.1;transform:translate(30px,-30px)}
        .stat-card.blue::after{background:var(--primary)}
        .stat-card.green::after{background:var(--green)}
        .stat-card.orange::after{background:var(--secondary)}
        .stat-card.red::after{background:var(--red)}
        .stat-card-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;font-size:1.3rem}
        .stat-card-icon.blue{background:rgba(79,70,229,0.1);color:var(--primary)}
        .stat-card-icon.green{background:rgba(16,185,129,0.1);color:var(--green)}
        .stat-card-icon.orange{background:rgba(245,158,11,0.1);color:var(--secondary)}
        .stat-card-icon.red{background:rgba(239,68,68,0.1);color:var(--red)}
        .stat-card h3{font-size:2rem;font-weight:800;color:var(--dark)}
        .stat-card p{color:var(--gray);font-size:0.85rem}

        /* Orders Table */
        .orders-section{background:var(--white);border-radius:16px;padding:30px;box-shadow:var(--shadow)}
        .orders-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;flex-wrap:wrap;gap:15px}
        .orders-header h2{font-size:1.3rem;font-weight:700}
        .orders-filters{display:flex;gap:10px}
        .orders-search{padding:10px 20px;border:2px solid var(--gray-light);border-radius:10px;font-family:'Poppins',sans-serif;width:250px;transition:var(--transition)}
        .orders-search:focus{border-color:var(--primary);outline:none}
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:15px 12px;border-bottom:2px solid var(--gray-light);color:var(--gray);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
        td{padding:15px 12px;border-bottom:1px solid var(--gray-light);font-size:0.85rem}
        tr:hover{background:rgba(79,70,229,0.02)}
        .customer-info{display:flex;align-items:center;gap:10px}
        .customer-avatar{width:35px;height:35px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:var(--white);font-weight:700;font-size:0.8rem}
        .customer-name{font-weight:600}
        .customer-email{font-size:0.75rem;color:var(--gray)}
        .status-badge{padding:5px 12px;border-radius:50px;font-size:0.7rem;font-weight:600}
        .status-completed{background:rgba(16,185,129,0.1);color:var(--green)}
        .status-pending{background:rgba(245,158,11,0.1);color:var(--secondary)}
        .payment-badge{padding:4px 10px;border-radius:6px;font-size:0.7rem;font-weight:600;background:var(--gray-light)}
        .btn-view{padding:6px 14px;background:var(--primary);color:var(--white);border:none;border-radius:8px;cursor:pointer;transition:var(--transition);font-size:0.75rem;font-weight:600}
        .btn-view:hover{transform:scale(1.05)}
        .btn-delete{padding:6px 14px;background:rgba(239,68,68,0.1);color:var(--red);border:none;border-radius:8px;cursor:pointer;transition:var(--transition);font-size:0.75rem;font-weight:600}
        .btn-delete:hover{background:var(--red);color:var(--white)}
        .no-orders{text-align:center;padding:60px 20px;color:var(--gray)}
        .no-orders i{font-size:4rem;color:var(--gray-light);margin-bottom:15px}

        /* Detail Modal */
        .detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:var(--transition);backdrop-filter:blur(5px)}
        .detail-overlay.active{opacity:1;visibility:visible}
        .detail-modal{background:var(--white);border-radius:20px;padding:35px;max-width:550px;width:90%;max-height:85vh;overflow-y:auto;transform:scale(0.8);transition:0.4s cubic-bezier(0.68,-0.55,0.265,1.55)}
        .detail-overlay.active .detail-modal{transform:scale(1)}
        .detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
        .detail-header h2{font-size:1.2rem;font-weight:700}
        .detail-close{width:35px;height:35px;border-radius:50%;border:none;background:var(--gray-light);cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center}
        .detail-close:hover{background:var(--red);color:var(--white);transform:rotate(90deg)}
        .detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gray-light)}
        .detail-row:last-child{border-bottom:none}
        .detail-label{color:var(--gray);font-size:0.85rem}
        .detail-value{font-weight:600;font-size:0.9rem;text-align:right}
        .detail-items{margin:20px 0}
        .detail-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--gray-light);border-radius:10px;margin-bottom:8px}
        .detail-item img{width:50px;height:50px;border-radius:8px;object-fit:cover}
        .detail-item-info h4{font-size:0.85rem;font-weight:600}
        .detail-item-info p{font-size:0.75rem;color:var(--gray)}

        /* Responsive */
        @media(max-width:1024px){.stats-row{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:768px){.sidebar{width:70px;padding:20px 10px}.sidebar-logo span,.sidebar-menu a span,.admin-badge{display:none}.sidebar-menu a{justify-content:center;padding:12px}.main{margin-left:70px}.stats-row{grid-template-columns:1fr}table{font-size:0.75rem}th,td{padding:10px 6px}.orders-filters{flex-wrap:wrap}}
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="index.html" class="sidebar-logo"><img src="edulogo1.png" alt="EduBazar Logo" style="height:32px;width:auto;border-radius:8px;"><span>EduBazar</span></a>
        <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Panel</div>
        <ul class="sidebar-menu">
            <li><a href="admin-dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <li><a href="#"><i class="fas fa-box-open"></i><span>All Orders</span></a></li>
            <li><a href="#"><i class="fas fa-users"></i><span>Customers</span></a></li>
            <li><a href="#"><i class="fas fa-book"></i><span>Products</span></a></li>
            <li><a href="user-dashboard.html"><i class="fas fa-user"></i><span>User Panel</span></a></li>
            <li><a href="index.html"><i class="fas fa-store"></i><span>View Store</span></a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
            <div class="topbar-right">
                <button class="btn-export" id="exportBtn"><i class="fas fa-file-export"></i> Export CSV</button>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Store</a>
                <div class="admin-avatar">A</div>
            </div>
        </div>

        <div class="stats-row" data-aos="fade-up">
            <div class="stat-card blue">
                <div class="stat-card-icon blue"><i class="fas fa-shopping-bag"></i></div>
                <h3 id="adminTotalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card green">
                <div class="stat-card-icon green"><i class="fas fa-rupee-sign"></i></div>
                <h3 id="adminRevenue">₹0</h3>
                <p>Total Revenue</p>
            </div>
            <div class="stat-card orange">
                <div class="stat-card-icon orange"><i class="fas fa-users"></i></div>
                <h3 id="adminCustomers">0</h3>
                <p>Unique Customers</p>
            </div>
            <div class="stat-card red">
                <div class="stat-card-icon red"><i class="fas fa-download"></i></div>
                <h3 id="adminDownloads">0</h3>
                <p>Total Downloads</p>
            </div>
        </div>

        <div class="orders-section" data-aos="fade-up">
            <div class="orders-header">
                <h2><i class="fas fa-list-alt"></i> All Customer Orders</h2>
                <input type="text" class="orders-search" placeholder="Search by name, email, order ID..." id="adminSearch">
            </div>
            <div id="adminOrdersContainer"></div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-modal" id="detailModal">
            <div class="detail-header">
                <h2>Order Details</h2>
                <button class="detail-close" id="detailClose"><i class="fas fa-times"></i></button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        AOS.init({duration: 800, once: true});

        // Auth check
        if (sessionStorage.getItem('adminAuth') !== 'true') {
            window.location.href = 'admin-login.html';
        }

        async function loadOrders() {
            let orders = [];

            // Try Supabase first
            if (supabase) {
                try {
                    const { data } = await supabase.from('orders').select('*').order('date', { ascending: false });
                    if (data && data.length > 0) {
                        orders = data.map(o => ({
                            orderId: o.order_id,
                            name: o.name,
                            email: o.email,
                            phone: o.phone,
                            items: typeof o.items === 'string' ? JSON.parse(o.items) : o.items,
                            total: o.total,
                            status: o.status,
                            paymentMethod: o.payment_method,
                            paymentId: o.payment_id,
                            date: o.date
                        }));
                    }
                } catch (e) {}
            }

            // Fallback to localStorage
            if (orders.length === 0) {
                orders = JSON.parse(localStorage.getItem('edubazar_orders')) || [];
            }

            renderOrders(orders);
            return orders;
        }

        let orders = [];
        loadOrders().then(o => { orders = o; });

        function renderOrders(list) {
            document.getElementById('adminTotalOrders').textContent = list.length;
            const revenue = list.reduce((s, o) => s + (o.total || 0), 0);
            document.getElementById('adminRevenue').textContent = '₹' + revenue;
            const uniqueEmails = [...new Set(list.map(o => o.email))];
            document.getElementById('adminCustomers').textContent = uniqueEmails.length;

            const container = document.getElementById('adminOrdersContainer');
            if (list.length === 0) {
                container.innerHTML = `<div class="no-orders"><i class="fas fa-inbox"></i><h3>No Orders Found</h3><p>No customer orders yet.</p></div>`;
                return;
            }
            const paymentLabels = {upi:'UPI/GPay', card:'Credit/Debit Card', netbanking:'Net Banking'};
            let html = `<table><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
            list.forEach((order, idx) => {
                const date = new Date(order.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                const initials = (order.name || 'U').split(' ').map(n => n[0]).join('').toUpperCase();
                html += `<tr data-idx="${idx}">
                    <td><strong>${order.orderId}</strong></td>
                    <td><div class="customer-info"><div class="customer-avatar">${initials}</div><div><div class="customer-name">${order.name}</div><div class="customer-email">${order.email}</div></div></div></td>
                    <td>${(order.items||[]).map(i => i.name).join(', ')}</td>
                    <td><strong>₹${order.total}</strong></td>
                    <td><span class="payment-badge">${paymentLabels[order.paymentMethod] || order.paymentMethod || 'Razorpay'}</span></td>
                    <td>${date}</td>
                    <td><span class="status-badge status-completed">Completed</span></td>
                    <td><button class="btn-view" onclick="viewOrder(${idx})"><i class="fas fa-eye"></i></button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function viewOrder(idx) {
            const order = orders[idx];
            const date = new Date(order.date).toLocaleString('en-IN');
            let html = `
                <div class="detail-row"><span class="detail-label">Order ID</span><span class="detail-value" style="color:var(--primary)">${order.orderId}</span></div>
                <div class="detail-row"><span class="detail-label">Customer Name</span><span class="detail-value">${order.name}</span></div>
                <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${order.email}</span></div>
                <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${order.phone || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Date & Time</span><span class="detail-value">${date}</span></div>
                <div class="detail-row"><span class="detail-label">Total Amount</span><span class="detail-value" style="color:var(--green);font-size:1.1rem">₹${order.total}</span></div>
                <div class="detail-items"><h4 style="margin-bottom:10px;font-size:0.95rem">Items Purchased</h4>`;
            (order.items||[]).forEach(item => {
                html += `<div class="detail-item"><img src="${item.img}" alt="${item.name}"><div class="detail-item-info"><h4>${item.name}</h4><p>Qty: ${item.qty} | Price: ₹${item.price * item.qty}</p></div></div>`;
            });
            html += `</div>`;
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailOverlay').classList.add('active');
        }

        document.getElementById('detailClose').addEventListener('click', () => document.getElementById('detailOverlay').classList.remove('active'));
        document.getElementById('detailOverlay').addEventListener('click', (e) => { if (e.target.id === 'detailOverlay') document.getElementById('detailOverlay').classList.remove('active'); });

        document.getElementById('adminSearch').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = orders.filter(o =>
                (o.name||'').toLowerCase().includes(val) ||
                (o.email||'').toLowerCase().includes(val) ||
                (o.orderId||'').toLowerCase().includes(val) ||
                (o.phone||'').includes(val)
            );
            renderOrders(filtered);
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (orders.length === 0) { alert('No orders to export'); return; }
            let csv = 'Order ID,Customer Name,Email,Phone,Items,Total,Payment,Date,Status\n';
            orders.forEach(o => {
                const date = new Date(o.date).toLocaleString('en-IN');
                csv += `"${o.orderId}","${o.name}","${o.email}","${o.phone||''}","${(o.items||[]).map(i=>i.name).join('; ')}","₹${o.total}","${o.paymentMethod||'Razorpay'}","${date}","Completed"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'edubazar_orders.csv';
            a.click(); URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
